name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FIELDWISE_AI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: FIELDWISE_AI/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
